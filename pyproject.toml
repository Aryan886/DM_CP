[project]
name = "stockrelate"
version = "1.0.0"
description = "Discrete Mathematics teaching app: correlation relations, properties and reachability classes"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
